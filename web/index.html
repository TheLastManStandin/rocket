<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Racketka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter stands in for the reference board's SF Pro Display, which is
      Apple's and not ours to ship. Apple devices reach the real thing through
      -apple-system in the stack and never touch this; everywhere else it is
      the difference between the board's face and whatever generic sans the
      system happens to hand back.

      IBM Plex Mono is the balance chip and nothing else, at one weight: that
      is what the reference sets that number in.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
