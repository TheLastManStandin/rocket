services:
  db:
    image: postgres:16-alpine
    container_name: racketka-db
    environment:
      POSTGRES_USER: racketka
      POSTGRES_PASSWORD: racketka
      POSTGRES_DB: racketka
    ports:
      # 5432 is often taken by another project; publish beside it.
      - "5433:5432"
    volumes:
      - racketka-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racketka -d racketka"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  racketka-db:
